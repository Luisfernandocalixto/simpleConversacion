<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Simple conversación">
    <meta property="og:url" content="https://simple-conversacion.netlify.app">
    <meta property="og:image" content="/img/image.webp">
    <meta property="og:description" content="Simulando una simple conversación con chatbot">  
    <meta name="description" content="Simulando una simple conversación con chatbot">  
    <title>Simple conversación</title>
    <link rel="stylesheet" href="/css/estilos.css">
    <link rel="shortcut icon" href="/img/image.webp" type="image/x-icon">
</head>

<body>
    <header class="content">
        <h1>Simple conversación</h1>
        <img src="/img/icono.webp" alt="Astronauta" class="imgPrincipal" width="200px">
    </header>
    <main class="chat content">
        <div id="chatbot"></div>
        <input type="text" id="userInput" placeholder="Escribe ejem: Hola" autocomplete="off" required>
        <button id="buttonSend" disabled >Enviar</button>
    </main>
    <br>
    <footer class="content" >
        <div class="flex">
            <div>
                <img src="/img/image.webp" class="imgPrincipal" width="200px" alt="Astronauta">
            </div>
            <div id="result" >
            </div>
            <div class="input" >
                <input type="text" id="ans" placeholder="Escribe tu nombre" required autocomplete="off" />
            </div>
        </div>

    </footer>
    <script  src="/js/index.js" type="module"></script>
    <script   src="/js/app.js" type="module" ></script>
</body>

</html>
